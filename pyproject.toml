[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgo-brain"
version = "0.5.0"
description = "Local telemetry, diagnostics and digital-twin prototype for Microcar M.Go / Progress ACT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
analytics = [
  "duckdb>=1.3,<2",
]
hardware = [
  "python-can>=4,<5",
  "cantools>=39,<42",
  "pymodbus>=3,<4",
  "pyserial>=3.5,<4",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
mgo-brain = "mgo_brain.main:run"

[tool.setuptools.packages.find]
include = ["mgo_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
