[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgo-brain"
version = "0.5.11"
description = "Experimental local telemetry and diagnostics platform for Microcar M.Go / Progress ACT"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["microcar", "telemetry", "diagnostics", "can-bus", "vehicle", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
analytics = [
  "duckdb>=1.3,<2",
]
hardware = [
  "python-can>=4,<5",
  "cantools>=39,<45",
  "pymodbus>=3,<4",
  "pyserial>=3.5,<4",
]
ai = [
  "openai>=3,<4",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/chup1runov/mgo-brain"
Repository = "https://github.com/chup1runov/mgo-brain"
Issues = "https://github.com/chup1runov/mgo-brain/issues"
Documentation = "https://github.com/chup1runov/mgo-brain/tree/main/docs"

[project.scripts]
mgo-brain = "mgo_brain.main:run"
mgo-survey = "mgo_brain.survey_cli:main"
mgo-can-record = "mgo_brain.record_cli:main"
mgo-can-replay = "mgo_brain.replay_cli:main"
mgo-survey-session = "mgo_brain.survey_session_cli:main"
mgo-doctor = "mgo_brain.doctor_cli:main"
mgo-backup = "mgo_brain.backup_cli:main"
mgo-kiosk = "mgo_brain.kiosk_cli:main"
mgo-discover-numeric = "mgo_brain.numeric_discovery_cli:main"
mgo-ask = "mgo_brain.ai_cli:main"
mgo-bench-smoke = "mgo_brain.bench_cli:main"

[tool.setuptools.packages.find]
include = ["mgo_brain*"]

[tool.setuptools.package-data]
mgo_brain = ["static/*", "default_config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
