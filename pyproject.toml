[project]
name = "mgo-brain"
version = "0.1.0"
description = "Local telemetry, diagnostics and digital-twin prototype for Microcar M.Go / Progress ACT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
analytics = [
  "duckdb>=1.5,<2",
  "pyarrow>=18,<24",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
mgo-brain = "mgo_brain.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
