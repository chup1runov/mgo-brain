name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analytics]'

      - name: Compile
        run: python -m compileall -q mgo_brain tests

      - name: Test
        run: pytest -q

  hardware-optional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install hardware extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analytics,hardware]'

      - name: Import hardware dependencies
        run: python -c "import can, cantools, pymodbus, serial; import mgo_brain.sources.can, mgo_brain.sources.dbc, mgo_brain.sources.modbus"

      - name: Hardware-abstraction tests
        run: pytest -q tests/test_v05_sources.py

  ai-optional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analytics,ai]'

      - name: Import OpenAI SDK
        run: python -c "from openai import OpenAI; import openai; print(openai.__version__)"

      - name: AI gateway tests
        env:
          MGO_AI_PROVIDER: local
        run: pytest -q tests/test_v057_ai.py
