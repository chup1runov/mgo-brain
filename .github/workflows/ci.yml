name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analytics]'

      - name: Compile
        run: python -m compileall -q mgo_brain tests

      - name: Test
        run: pytest -q

  hardware-optional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hardware extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analytics,hardware]'

      - name: Import hardware dependencies
        run: python -c "import can, cantools, pymodbus, serial; import mgo_brain.sources.can, mgo_brain.sources.dbc, mgo_brain.sources.modbus"

      - name: Hardware-abstraction tests
        run: pytest -q tests/test_v05_sources.py

  ai-optional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analytics,ai]'

      - name: Import OpenAI SDK
        run: python -c "from openai import OpenAI; import openai; print(openai.__version__)"

      - name: AI gateway tests
        env:
          MGO_AI_PROVIDER: local
        run: pytest -q tests/test_v057_ai.py

  package-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel outside repository
        run: |
          python -m venv /tmp/mgo-wheel
          /tmp/mgo-wheel/bin/pip install dist/*.whl
          /tmp/mgo-wheel/bin/pip check

      - name: Smoke installed package and bundled resources
        run: |
          cd /tmp
          export MGO_BRAIN_DATA_DIR=/tmp/mgo-wheel-data
          /tmp/mgo-wheel/bin/mgo-brain > /tmp/mgo-wheel.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          /tmp/mgo-wheel/bin/python - <<'PY'
          import json,time,urllib.request
          for _ in range(60):
              try:
                  health=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=1))
                  if health.get('ready'):
                      assert 'data_dir' not in health and 'config_dir' not in health
                      html=urllib.request.urlopen('http://127.0.0.1:8080/',timeout=1).read().decode()
                      assert '<html lang="ru">' in html
                      print('WHEEL_SMOKE_OK', health['version'], health['source'])
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError('installed-wheel server did not become ready')
          PY
