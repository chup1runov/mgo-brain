name: Repository audit
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,analytics,hardware]' playwright
      - name: Inventory, Python/JS syntax, local documentation links
        id: static
        continue-on-error: true
        run: python tools/repository_audit.py
      - name: Complete test suite
        id: tests
        continue-on-error: true
        run: pytest -q --junitxml=audit-output/pytest.xml
      - name: Bench smoke
        id: bench
        continue-on-error: true
        run: mgo-bench-smoke --json-out audit-output/bench.json
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Actual browser smoke
        id: browser
        continue-on-error: true
        env:
          MGO_BRAIN_DATA_DIR: /tmp/mgo-audit-browser
          MGO_BRAIN_SOURCES_FILE: config/sources-bench.json
          MGO_AI_PROVIDER: local
        run: |
          mgo-brain > /tmp/mgo-audit-server.log 2>&1 &
          python tools/browser_audit.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repository-audit
          path: audit-output/
      - name: Gate
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BENCH: ${{ steps.bench.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          python -c "import os; names=('STATIC','TESTS','BENCH','BROWSER'); print({k:os.environ[k] for k in names}); assert all(os.environ[k]=='success' for k in names)"
